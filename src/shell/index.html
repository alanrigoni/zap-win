<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>ZapWin</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <nav id="sidebar">
    <div id="accounts" role="tablist" aria-label="Contas"></div>
    <div class="tools">
      <button id="add" class="tool" title="Adicionar conta (Ctrl+Shift+N)" aria-label="Adicionar conta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="settings" class="tool" title="Configurações" aria-label="Configurações">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </button>
    </div>
  </nav>

  <main id="placeholder">
    <img src="../assets/icon.png" alt="" width="72" height="72">
    <p>Carregando o WhatsApp…</p>
  </main>

  <div id="modal" hidden>
    <form id="account-form" class="card" autocomplete="off">
      <h2 id="modal-title">Nova conta</h2>
      <label for="account-name">Nome</label>
      <input id="account-name" maxlength="40" placeholder="Ex.: Trabalho" required>
      <span class="label">Cor</span>
      <div id="colors" class="colors" role="radiogroup" aria-label="Cor"></div>
      <div class="actions">
        <button type="button" id="cancel">Cancelar</button>
        <button type="submit" class="primary">Salvar</button>
      </div>
    </form>
  </div>

  <script src="shell.js"></script>
</body>
</html>
